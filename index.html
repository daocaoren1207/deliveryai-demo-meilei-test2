<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf5ea" />
    <meta name="description" content="沸点火锅点单与门店履约概念演示，非官方产品" />
    <title>沸点 · 火锅点单概念演示</title>
    <script>
      (function () {
        // 同步设置初始语言到 html lang 属性
        try {
          var lang = localStorage.getItem('i18nextLng');
          document.documentElement.lang = (lang === 'en') ? 'en' : 'zh-CN';
        } catch (e) {
          // localStorage 不可用时保持默认中文
        }
        // React 挂载前同步主题，避免暗黑模式首屏闪烁
        try {
          var theme = localStorage.getItem('theme-mode');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = theme === 'dark' || (theme !== 'light' && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) metaThemeColor.setAttribute('content', dark ? '#211f1c' : '#fbf5ea');
        } catch (e) {
          // localStorage 不可用时保持默认明亮
        }
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
